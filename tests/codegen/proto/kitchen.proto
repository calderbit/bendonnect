syntax = "proto3";

package bendonnect.codegen.v1;

option go_package = "bendonnect/codegen/gen/go;kitchenv1";

// Every scalar kind, plus repeated, nested, recursive, map, oneof, optional
// and keyword-named fields.
message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
  COLOR_BLUE = 3;
}

message Repeats {
  repeated int32 packed_ints = 1;
  repeated int32 unpacked_ints = 2 [packed = false];
  repeated string names = 3;
  repeated bytes blobs = 4;
  repeated int64 longs = 5;
  repeated double doubles = 6;
  repeated bool flags = 7;
  repeated Color colors = 8;
  repeated Scalars items = 9;
}

message Outer {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ALPHA = 1;
    KIND_BETA = 2;
  }
  message Inner {
    string label = 1;
    Kind kind = 2;
  }
  Inner inner = 1;
  Kind kind = 2;
  Color color = 3;
  repeated Inner inners = 4;
}

// Recursive message.
message Tree {
  string name = 1;
  int32 weight = 2;
  Tree left = 3;
  Tree right = 4;
  repeated Tree children = 5;
}

message Maps {
  map<string, int64> counts = 1;
  map<int32, Scalars> by_id = 2;
  map<string, string> labels = 3;
  map<bool, string> flags = 4;
  map<uint64, bytes> blobs = 5;
  map<sint64, Color> colors = 6;
}

message Choice {
  string tag = 1;
  oneof value {
    int32 number = 2;
    string text = 3;
    Scalars scalars = 4;
    Color color = 5;
    bytes raw = 6;
  }
}

message Optionals {
  optional int32 maybe_int = 1;
  optional string maybe_string = 2;
  optional bool maybe_bool = 3;
  optional Color maybe_color = 4;
  optional int64 maybe_long = 5;
  int32 plain = 6;
  optional Scalars maybe_msg = 7;
  optional bytes maybe_bytes = 8;
  optional double maybe_double = 9;
}

// Fields whose names are Bend keywords.
message Keywords {
  string type = 1;
  int32 match = 2;
  bool def = 3;
  string import = 4;
  uint32 for = 5;
  string data = 6;
  Color kind = 7;
}

// Everything at once, for the golden vectors.
message Kitchen {
  Scalars scalars = 1;
  Repeats repeats = 2;
  Outer outer = 3;
  Tree tree = 4;
  Maps maps = 5;
  Choice choice = 6;
  Optionals optionals = 7;
  Keywords keywords = 8;
}
